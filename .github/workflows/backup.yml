name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4.2.2

      - name: 데이터 백업
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p backups

          curl -s "$SUPABASE_URL/rest/v1/hr_tasks?select=*" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            > backups/hr_tasks_$DATE.json

          curl -s "$SUPABASE_URL/rest/v1/hr_exec_events?select=*" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            > backups/hr_exec_events_$DATE.json

          curl -s "$SUPABASE_URL/rest/v1/hr_master_events?select=*" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            > backups/hr_master_events_$DATE.json

      - name: 오래된 백업 정리
        run: |
          for TABLE in hr_tasks hr_exec_events hr_master_events; do
            FILES=$(ls -t backups/${TABLE}_*.json 2>/dev/null)
            COUNT=$(echo "$FILES" | wc -l)
            if [ "$COUNT" -gt 10 ]; then
              echo "$FILES" | tail -n +11 | xargs rm -f
            fi
          done

      - name: GitHub에 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date +'%Y-%m-%d') 주간 백업"
          git push
